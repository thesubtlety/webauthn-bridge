<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 244" role="img" aria-labelledby="title desc"><title id="title">Profile configuration and preflight</title><desc id="desc">Preflight checks the requesting browser. The signing browser validates its own page during authentication.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#617688" stroke-width="1.5"/></marker></defs><rect width="1080" height="244" rx="18" fill="#edf3f2"/><text x="40" y="44" font-family="monospace" font-size="12" fill="#53716a">01 / REQUESTING</text><rect x="40" y="67" width="310" height="108" rx="12" fill="white" stroke="#c5d5d0"/><text x="58" y="108" font-family="sans-serif" font-size="18" font-weight="600" fill="#183b35">Manage profiles</text><text x="58" y="139" font-family="sans-serif" font-size="14" fill="#526b64">Save RP + signing origin</text><path d="M357 120H374" stroke="#617688" stroke-width="1.5" marker-end="url(#arrow)"/><text x="384" y="44" font-family="monospace" font-size="12" fill="#53716a">02 / SIGNING</text><rect x="384" y="67" width="310" height="108" rx="12" fill="white" stroke="#c5d5d0"/><text x="402" y="108" font-family="sans-serif" font-size="18" font-weight="600" fill="#183b35">Signing rules</text><text x="402" y="139" font-family="sans-serif" font-size="14" fill="#526b64">Validate and store profile</text><path d="M701 120H718" stroke="#617688" stroke-width="1.5" marker-end="url(#arrow)"/><text x="728" y="44" font-family="monospace" font-size="12" fill="#53716a">03 / REQUESTING</text><rect x="728" y="67" width="310" height="108" rx="12" fill="white" stroke="#c5d5d0"/><text x="746" y="108" font-family="sans-serif" font-size="18" font-weight="600" fill="#183b35">Local preflight</text><text x="746" y="139" font-family="sans-serif" font-size="14" fill="#526b64">Page, permissions, origin</text><text x="40" y="213" font-family="sans-serif" font-size="14" fill="#526b64">Preflight checks the requesting browser. The signing browser validates its own page during authentication.</text></svg>